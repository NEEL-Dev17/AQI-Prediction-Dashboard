name: Hourly Data Update

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the new files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion and Training Pipeline
        run: |
          # 1. Fetch latest pollutants and weather
          python src/ingest_clean.py
          python src/ingest_weather.py
          
          # 2. Merge the datasets
          python -c "import pandas as pd; aq=pd.read_parquet('data/raw/air_quality.parquet'); w=pd.read_parquet('data/raw/weather.parquet'); merged=pd.concat([aq, w], ignore_index=True).drop_duplicates(subset=['city','timestamp','pollutant']); merged.to_parquet('data/raw/air_quality.parquet', index=False)"
          
          # 3. Preprocess and Retrain
          python -m src.preprocess
          python -m src.train

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add data/raw/air_quality.parquet
          git add data/processed/features.parquet
          git add models/xgb_aqi.pkl
          git commit -m "Automated hourly data update [skip ci]" || echo "No changes to commit"
          git push